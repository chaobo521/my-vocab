<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Sec 2 English Vocabulary App</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    color: #333;
    padding: 16px;
    user-select: none;
  }
  .app { max-width: 720px; margin: 0 auto; }
  header {
    text-align: center;
    color: white;
    margin-bottom: 20px;
  }
  header h1 { font-size: 24px; margin-bottom: 6px; }
  header .sub { font-size: 13px; opacity: 0.85; }

  .nav {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 3px;
    background: rgba(255,255,255,0.15);
    padding: 5px;
    border-radius: 14px;
    margin-bottom: 16px;
    backdrop-filter: blur(10px);
  }
  .nav button {
    background: transparent;
    border: none;
    color: white;
    padding: 8px 2px;
    font-size: 12px;
    border-radius: 9px;
    cursor: pointer;
    transition: all 0.2s;
    font-weight: 500;
    position: relative;
  }
  .nav button .badge {
    position: absolute; top: 2px; right: 2px;
    background: #ff4757; color: white;
    font-size: 9px; padding: 1px 5px;
    border-radius: 8px; font-weight: 700;
    min-width: 14px;
  }
  .nav button.active {
    background: white;
    color: #667eea;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
  }
  .nav button .ico { display: block; font-size: 20px; margin-bottom: 2px; }

  .panel {
    background: white;
    border-radius: 18px;
    padding: 20px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.15);
    min-height: 420px;
  }

  /* Category filter */
  .cats {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 16px;
  }
  .cats button {
    background: #f0f2f5;
    border: none;
    padding: 6px 12px;
    border-radius: 16px;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .cats button.active {
    background: #667eea;
    color: white;
  }

  /* Browse list */
  .word-list { display: flex; flex-direction: column; gap: 10px; }
  .word-card {
    background: #fafbfc;
    border: 2px solid #eef0f3;
    border-radius: 12px;
    padding: 14px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .word-card:active { transform: scale(0.98); }
  .word-card.mastered { background: #e8f8ee; border-color: #b6e6c5; }
  .word-card .row1 {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 6px;
  }
  .word-card .word {
    font-size: 22px; font-weight: 700; color: #2c3e50;
  }
  .word-card .meaning {
    font-size: 16px; color: #667eea; font-weight: 600;
  }
  .word-card .example {
    font-size: 13px; color: #555; font-style: italic; margin-top: 6px; line-height: 1.5;
  }
  .word-card .syn-ant {
    font-size: 12px; color: #888; margin-top: 6px;
  }
  .word-card .syn-ant span { margin-right: 12px; }
  .word-card .actions {
    display: flex; gap: 8px; margin-top: 10px;
  }
  .word-card .actions button {
    flex: 1; padding: 8px; border: none; border-radius: 8px;
    font-size: 13px; cursor: pointer; font-weight: 600;
  }
  .btn-play { background: #667eea; color: white; }
  .btn-master { background: #28c76f; color: white; }
  .btn-unmaster { background: #ff9f43; color: white; }

  /* Flashcard */
  .flash-wrap {
    display: flex; flex-direction: column; align-items: center;
    padding: 10px;
  }
  .flash-progress {
    color: #888; font-size: 13px; margin-bottom: 14px;
  }
  .flash-card {
    width: 100%; max-width: 440px; height: 280px;
    border-radius: 20px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    box-shadow: 0 8px 28px rgba(102,126,234,0.3);
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    text-align: center;
    padding: 24px;
    transition: transform 0.15s;
    position: relative;
  }
  .flash-card:active { transform: scale(0.98); }
  .flash-card.flipped {
    background: linear-gradient(135deg, #f6d365 0%, #fda085 100%);
  }
  .flash-card .big {
    font-size: 38px; font-weight: 700; margin-bottom: 12px;
  }
  .flash-card .small {
    font-size: 15px; opacity: 0.95; line-height: 1.5;
  }
  .flash-card .hint {
    position: absolute; bottom: 12px; left: 0; right: 0;
    text-align: center; font-size: 11px; opacity: 0.7;
  }
  .flash-controls {
    display: flex; gap: 10px; margin-top: 18px; width: 100%;
    max-width: 440px;
  }
  .flash-controls button {
    flex: 1; padding: 14px; border: none; border-radius: 12px;
    font-size: 15px; font-weight: 600; cursor: pointer;
  }
  .btn-prev { background: #f0f2f5; color: #555; }
  .btn-next { background: #667eea; color: white; }
  .btn-speak { background: #28c76f; color: white; }
  .flash-mode-toggle {
    margin-bottom: 14px;
    display: flex; gap: 6px;
  }
  .flash-mode-toggle button {
    background: #f0f2f5; border: none; padding: 6px 14px;
    border-radius: 14px; font-size: 12px; cursor: pointer;
  }
  .flash-mode-toggle button.active {
    background: #667eea; color: white;
  }

  /* Spelling */
  .spell-wrap { padding: 10px; text-align: center; }
  .spell-meaning {
    font-size: 32px; font-weight: 700; color: #667eea; margin: 20px 0 6px;
  }
  .spell-hint {
    font-size: 13px; color: #888; margin-bottom: 18px;
  }
  .spell-input {
    width: 100%; max-width: 360px;
    padding: 14px; font-size: 22px;
    border: 2px solid #eef0f3; border-radius: 12px;
    text-align: center; outline: none;
    transition: border-color 0.2s;
  }
  .spell-input:focus { border-color: #667eea; }
  .spell-input.correct { border-color: #28c76f; background: #e8f8ee; }
  .spell-input.wrong { border-color: #ea5455; background: #fde8e8; }
  .spell-feedback {
    margin-top: 14px; font-size: 16px; min-height: 24px; font-weight: 600;
  }
  .spell-feedback.correct { color: #28c76f; }
  .spell-feedback.wrong { color: #ea5455; }
  .spell-actions {
    display: flex; gap: 10px; justify-content: center; margin-top: 18px;
    flex-wrap: wrap;
  }
  .spell-actions button {
    padding: 10px 20px; border: none; border-radius: 10px;
    font-size: 14px; font-weight: 600; cursor: pointer;
  }
  .spell-stats {
    margin-top: 20px; padding-top: 16px;
    border-top: 1px dashed #eef0f3;
    color: #666; font-size: 13px;
  }

  /* Quiz */
  .quiz-wrap { padding: 6px; }
  .quiz-q {
    text-align: center; margin: 16px 0 22px;
  }
  .quiz-q .label { font-size: 13px; color: #888; margin-bottom: 8px; }
  .quiz-q .word {
    font-size: 32px; font-weight: 700; color: #2c3e50;
  }
  .quiz-options {
    display: grid; gap: 10px;
  }
  .quiz-options button {
    padding: 14px; background: #f8f9fa;
    border: 2px solid #eef0f3; border-radius: 12px;
    font-size: 15px; cursor: pointer; text-align: left;
    transition: all 0.15s;
  }
  .quiz-options button:hover { border-color: #667eea; }
  .quiz-options button.correct {
    background: #e8f8ee; border-color: #28c76f; color: #1e7e34;
  }
  .quiz-options button.wrong {
    background: #fde8e8; border-color: #ea5455; color: #c0392b;
  }
  .quiz-options button:disabled { cursor: default; }
  .quiz-progress {
    text-align: center; color: #888; font-size: 13px; margin-bottom: 6px;
  }
  .quiz-score {
    text-align: center; margin-top: 16px; font-size: 14px; color: #666;
  }

  /* Progress */
  .prog-wrap { padding: 6px; }
  .prog-summary {
    text-align: center; padding: 20px; background: #f8f9ff;
    border-radius: 14px; margin-bottom: 16px;
  }
  .prog-num {
    font-size: 48px; font-weight: 700; color: #667eea;
  }
  .prog-bar {
    width: 100%; height: 12px; background: #eef0f3;
    border-radius: 6px; overflow: hidden; margin: 12px 0;
  }
  .prog-bar-fill {
    height: 100%; background: linear-gradient(90deg, #667eea, #28c76f);
    transition: width 0.4s;
  }
  .prog-cats { display: flex; flex-direction: column; gap: 8px; }
  .prog-cat {
    background: #fafbfc; padding: 12px; border-radius: 10px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .prog-cat .name { font-weight: 600; font-size: 14px; }
  .prog-cat .count { color: #667eea; font-weight: 600; font-size: 13px; }
  .reset-btn {
    width: 100%; margin-top: 16px; padding: 12px;
    background: #f0f2f5; border: none; border-radius: 10px;
    color: #999; font-size: 13px; cursor: pointer;
  }

  /* Story */
  .story-list { display: flex; flex-direction: column; gap: 12px; }
  .story-card {
    background: linear-gradient(135deg, #fffaf0 0%, #ffe4b5 100%);
    border: 2px solid #f4d4a3;
    border-radius: 14px;
    padding: 16px;
    cursor: pointer;
    transition: transform 0.15s;
  }
  .story-card:active { transform: scale(0.98); }
  .story-card .s-title {
    font-size: 18px; font-weight: 700; color: #8b4513; margin-bottom: 6px;
  }
  .story-card .s-era {
    font-size: 12px; color: #b87333; margin-bottom: 8px;
  }
  .story-card .s-intro {
    font-size: 13px; color: #6b4226; line-height: 1.6;
  }
  .story-card .s-tag {
    display: inline-block; background: #8b4513; color: white;
    font-size: 11px; padding: 2px 8px; border-radius: 10px; margin-top: 8px;
  }
  .story-detail {
    padding: 4px;
  }
  .story-back {
    background: #f0f2f5; border: none; padding: 8px 14px;
    border-radius: 8px; cursor: pointer; font-size: 13px; margin-bottom: 14px;
  }
  .story-detail h2 {
    color: #8b4513; font-size: 22px; margin-bottom: 4px;
  }
  .story-detail .era {
    color: #b87333; font-size: 13px; margin-bottom: 16px;
    padding-bottom: 12px; border-bottom: 2px dashed #f4d4a3;
  }
  .story-detail p {
    line-height: 1.9; font-size: 15px; color: #333;
    margin-bottom: 14px;
    text-align: justify;
  }
  .vocab-inline {
    display: inline-block;
    background: linear-gradient(120deg, #a8edea 0%, #fed6e3 100%);
    color: #5a2d82; font-weight: 700;
    padding: 1px 8px; border-radius: 6px;
    cursor: pointer; margin: 0 2px;
    border-bottom: 2px solid #b39ddb;
    transition: transform 0.1s;
  }
  .vocab-inline:active { transform: scale(0.95); }
  .vocab-inline .zh {
    font-size: 12px; color: #7b3fa0; font-weight: 500; margin-left: 2px;
  }
  .story-words {
    margin-top: 18px; padding: 14px;
    background: #f8f9ff; border-radius: 12px;
  }
  .story-words .title {
    font-weight: 700; color: #5a2d82; font-size: 14px; margin-bottom: 10px;
  }
  .story-words .chips {
    display: flex; flex-wrap: wrap; gap: 6px;
  }
  .story-words .chip {
    background: white; border: 1px solid #d4c5e8;
    padding: 4px 10px; border-radius: 14px; font-size: 12px;
    cursor: pointer; color: #5a2d82;
  }

  /* Wrong Book */
  .wb-empty {
    text-align: center; padding: 40px 20px; color: #888;
  }
  .wb-empty .big { font-size: 48px; margin-bottom: 10px; }
  .wb-summary {
    background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
    padding: 16px; border-radius: 14px; margin-bottom: 14px;
    color: #6b2c4f;
  }
  .wb-summary .num { font-size: 28px; font-weight: 700; }
  .wb-summary .desc { font-size: 13px; opacity: 0.85; margin-top: 4px; }
  .wb-practice-btn {
    width: 100%; padding: 14px; margin-top: 10px;
    background: white; color: #c0392b; border: none;
    border-radius: 10px; font-size: 15px; font-weight: 700;
    cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  }
  .wb-list { display: flex; flex-direction: column; gap: 8px; }
  .wb-item {
    background: #fff5f5; border: 1px solid #ffe0e0;
    padding: 12px; border-radius: 10px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .wb-item .info .word {
    font-size: 16px; font-weight: 700; color: #c0392b;
  }
  .wb-item .info .meta {
    font-size: 12px; color: #888; margin-top: 2px;
  }
  .wb-item .streak {
    display: flex; gap: 3px;
  }
  .wb-item .dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: #f0d0d0;
  }
  .wb-item .dot.on { background: #28c76f; }
  .wb-item .actions {
    display: flex; gap: 6px;
  }
  .wb-item .actions button {
    padding: 6px 10px; font-size: 12px; border: none;
    border-radius: 6px; cursor: pointer;
  }
  .wb-practice-mode {
    text-align: center; padding: 10px;
  }

  /* Daily check-in & calendar */
  .today-card {
    background: linear-gradient(135deg, #84fab0 0%, #8fd3f4 100%);
    padding: 16px; border-radius: 14px; margin-bottom: 14px;
    color: #1d4f3f;
  }
  .today-card .row {
    display: flex; justify-content: space-around;
    margin-top: 10px; padding-top: 10px;
    border-top: 1px solid rgba(255,255,255,0.4);
  }
  .today-card .stat { text-align: center; }
  .today-card .stat .n { font-size: 20px; font-weight: 700; }
  .today-card .stat .l { font-size: 11px; opacity: 0.85; }
  .checkin-row {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 6px;
  }
  .checkin-row .title { font-size: 16px; font-weight: 700; }
  .checkin-row .streak {
    background: rgba(255,255,255,0.4); padding: 4px 10px;
    border-radius: 12px; font-size: 13px; font-weight: 600;
  }

  .calendar {
    background: white; padding: 14px; border-radius: 12px;
    margin-bottom: 14px; border: 1px solid #eef0f3;
  }
  .calendar .ch-title {
    font-weight: 700; color: #444; margin-bottom: 10px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .calendar .ch-title .month { font-size: 15px; }
  .calendar .ch-title .nav-btn {
    background: #f0f2f5; border: none; width: 28px; height: 28px;
    border-radius: 6px; cursor: pointer; font-size: 14px;
  }
  .cal-grid {
    display: grid; grid-template-columns: repeat(7, 1fr);
    gap: 4px;
  }
  .cal-grid .dh {
    text-align: center; font-size: 11px; color: #999;
    padding: 4px 0;
  }
  .cal-grid .day {
    aspect-ratio: 1; display: flex; align-items: center;
    justify-content: center; font-size: 13px; border-radius: 6px;
    color: #666; position: relative;
  }
  .cal-grid .day.empty { visibility: hidden; }
  .cal-grid .day.today {
    border: 2px solid #667eea; font-weight: 700;
  }
  .cal-grid .day.checked {
    background: linear-gradient(135deg, #28c76f, #20a065);
    color: white; font-weight: 600;
  }
  .cal-grid .day.checked.today {
    border-color: #fff; box-shadow: 0 0 0 2px #667eea;
  }

  /* Time chart */
  .chart {
    background: white; padding: 14px; border-radius: 12px;
    margin-bottom: 14px; border: 1px solid #eef0f3;
  }
  .chart .title { font-weight: 700; color: #444; margin-bottom: 12px; }
  .chart-bars {
    display: flex; justify-content: space-between; align-items: flex-end;
    height: 120px; gap: 6px;
  }
  .chart-bar {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; height: 100%;
    justify-content: flex-end;
  }
  .chart-bar .bar {
    width: 100%; background: linear-gradient(to top, #667eea, #a48ce8);
    border-radius: 4px 4px 0 0; min-height: 2px;
    position: relative;
    transition: height 0.4s;
  }
  .chart-bar .bar.zero { background: #eef0f3; }
  .chart-bar .bar .v {
    position: absolute; top: -16px; left: 50%;
    transform: translateX(-50%); font-size: 10px;
    color: #666; white-space: nowrap;
  }
  .chart-bar .label {
    font-size: 10px; color: #999; margin-top: 4px;
  }
  .chart-bar.today .label { color: #667eea; font-weight: 700; }

  .parent-section {
    background: #fff8e1; border-radius: 12px;
    padding: 14px; margin-bottom: 14px;
    border: 2px dashed #f4d4a3;
  }
  .parent-section .ph {
    font-weight: 700; color: #8b4513; margin-bottom: 10px;
    display: flex; align-items: center; gap: 6px;
  }
  .parent-stats {
    display: grid; grid-template-columns: repeat(2, 1fr);
    gap: 8px;
  }
  .parent-stats .ps {
    background: white; padding: 10px; border-radius: 8px;
    text-align: center;
  }
  .parent-stats .ps .n {
    font-size: 18px; font-weight: 700; color: #667eea;
  }
  .parent-stats .ps .l {
    font-size: 11px; color: #666; margin-top: 2px;
  }

  .toast {
    position: fixed; bottom: 30px; left: 50%;
    transform: translateX(-50%); background: rgba(0,0,0,0.8);
    color: white; padding: 10px 20px; border-radius: 20px;
    font-size: 14px; z-index: 100;
    opacity: 0; transition: opacity 0.3s;
    pointer-events: none;
  }
  .toast.show { opacity: 1; }

  @media (max-width: 480px) {
    .nav button { font-size: 11px; }
    .nav button .ico { font-size: 18px; }
    .flash-card { height: 240px; }
    .flash-card .big { font-size: 30px; }
    .spell-meaning { font-size: 28px; }
    .quiz-q .word { font-size: 26px; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>📖 Sec 2 Vocabulary</h1>
    <div class="sub">English · Math · Science · 1000 Words</div>
  </header>

  <nav class="nav" id="nav">
    <button data-mode="browse" class="active"><span class="ico">📚</span>Browse</button>
    <button data-mode="flash"><span class="ico">🎴</span>Flash</button>
    <button data-mode="spell"><span class="ico">✏️</span>Spell</button>
    <button data-mode="quiz"><span class="ico">🎯</span>Quiz</button>
    <button data-mode="story"><span class="ico">📜</span>Story</button>
    <button data-mode="wrong" id="wrongNav"><span class="ico">📕</span>Mistakes</button>
    <button data-mode="progress"><span class="ico">📊</span>Stats</button>
  </nav>

  <div class="panel" id="panel"></div>
</div>

<div class="toast" id="toast"></div>

<script>
const VOCAB = [
  // ===== Numbers & Arithmetic (50) =====
  {cat:"Numbers & Arithmetic", word:"integer", meaning:"a whole number, positive, negative, or zero", example:"-3, 0, and 7 are all integers.", syn:"whole number", ant:"-"},
  {cat:"Numbers & Arithmetic", word:"natural number", meaning:"a positive whole number used for counting", example:"1, 2, 3 are natural numbers.", syn:"counting number", ant:"-"},
  {cat:"Numbers & Arithmetic", word:"rational", meaning:"any number expressible as a fraction", example:"3/4 and 0.5 are rational numbers.", syn:"-", ant:"irrational"},
  {cat:"Numbers & Arithmetic", word:"irrational", meaning:"a number that cannot be written as a fraction", example:"π and √2 are irrational numbers.", syn:"-", ant:"rational"},
  {cat:"Numbers & Arithmetic", word:"decimal", meaning:"a number using a decimal point", example:"3.14 is a decimal.", syn:"-", ant:"-"},
  {cat:"Numbers & Arithmetic", word:"fraction", meaning:"a number written as one part over another", example:"1/2 is a fraction.", syn:"-", ant:"-"},
  {cat:"Numbers & Arithmetic", word:"numerator", meaning:"the top number of a fraction", example:"In 3/4, the numerator is 3.", syn:"-", ant:"denominator"},
  {cat:"Numbers & Arithmetic", word:"denominator", meaning:"the bottom number of a fraction", example:"In 3/4, the denominator is 4.", syn:"-", ant:"numerator"},
  {cat:"Numbers & Arithmetic", word:"percentage", meaning:"a number as parts per hundred", example:"50% means 50 out of 100.", syn:"per cent", ant:"-"},
  {cat:"Numbers & Arithmetic", word:"ratio", meaning:"comparison of two quantities", example:"The ratio of boys to girls is 2:3.", syn:"proportion", ant:"-"},
  {cat:"Numbers & Arithmetic", word:"proportion", meaning:"two equal ratios", example:"a/b = c/d shows a proportion.", syn:"ratio", ant:"-"},
  {cat:"Numbers & Arithmetic", word:"quotient", meaning:"the result of dividing", example:"In 12 ÷ 4 = 3, 3 is the quotient.", syn:"-", ant:"-"},
  {cat:"Numbers & Arithmetic", word:"dividend", meaning:"the number being divided", example:"In 20 ÷ 5, 20 is the dividend.", syn:"-", ant:"divisor"},
  {cat:"Numbers & Arithmetic", word:"divisor", meaning:"the number doing the dividing", example:"In 20 ÷ 5, 5 is the divisor.", syn:"-", ant:"dividend"},
  {cat:"Numbers & Arithmetic", word:"remainder", meaning:"what is left after division", example:"7 ÷ 2 leaves a remainder of 1.", syn:"-", ant:"-"},
  {cat:"Numbers & Arithmetic", word:"product", meaning:"result of multiplication", example:"The product of 3 and 4 is 12.", syn:"-", ant:"quotient"},

const CATS = [...new Set(VOCAB.map(v => v.cat))];
const STORE_KEY = 'vocab_progress_v1';
const DEFAULT_PROGRESS = {
  mastered: [], spellRight: 0, spellWrong: 0, quizRight: 0, quizWrong: 0,
  wrongBook: {},        // { word: { count, lastWrong, correctStreak } }
  studyDays: [],        // ["2026-05-01", ...]
  dailyTime: {},        // { "2026-05-01": seconds }
  dailyCorrect: {}      // { "2026-05-01": correctCount }
};
let progress = Object.assign({}, DEFAULT_PROGRESS, JSON.parse(localStorage.getItem(STORE_KEY) || '{}'));
// migrate old saves missing new fields
for (const k of Object.keys(DEFAULT_PROGRESS)) {
  if (progress[k] === undefined) progress[k] = JSON.parse(JSON.stringify(DEFAULT_PROGRESS[k]));
}

function save() { localStorage.setItem(STORE_KEY, JSON.stringify(progress)); }
function isMastered(w) { return progress.mastered.includes(w); }
function toggleMaster(w) {
  if (isMastered(w)) progress.mastered = progress.mastered.filter(x => x !== w);
  else progress.mastered.push(w);
  save();
}

function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function checkInToday() {
  const t = todayStr();
  if (!progress.studyDays.includes(t)) {
    progress.studyDays.push(t);
    save();
  }
}

function addStudyTime(seconds) {
  const t = todayStr();
  progress.dailyTime[t] = (progress.dailyTime[t] || 0) + seconds;
  if (seconds > 0) checkInToday();
}

function addCorrect() {
  const t = todayStr();
  progress.dailyCorrect[t] = (progress.dailyCorrect[t] || 0) + 1;
}

function getStreak() {
  const days = new Set(progress.studyDays);
  let streak = 0;
  let d = new Date();
  while (true) {
    const s = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    if (days.has(s)) { streak++; d.setDate(d.getDate()-1); }
    else break;
  }
  return streak;
}

function fmtTime(sec) {
  if (sec < 60) return `${sec} sec`;
  const m = Math.floor(sec/60), s = sec%60;
  if (m < 60) return s ? `${m}m ${s}s` : `${m} min`;
  const h = Math.floor(m/60), mm = m%60;
  return `${h}h ${mm}m`;
}

// Wrong book management
function recordWrong(word) {
  if (!progress.wrongBook[word]) {
    progress.wrongBook[word] = { count: 0, lastWrong: '', correctStreak: 0 };
  }
  progress.wrongBook[word].count++;
  progress.wrongBook[word].lastWrong = todayStr();
  progress.wrongBook[word].correctStreak = 0;
  save();
  updateWrongBadge();
}

function recordWrongBookCorrect(word) {
  if (!progress.wrongBook[word]) return;
  progress.wrongBook[word].correctStreak = (progress.wrongBook[word].correctStreak || 0) + 1;
  // graduate after 2 consecutive correct in wrong-book practice
  if (progress.wrongBook[word].correctStreak >= 2) {
    delete progress.wrongBook[word];
    toast(`🎓 "${word}" graduated!`);
  }
  save();
  updateWrongBadge();
}

function updateWrongBadge() {
  const btn = document.getElementById('wrongNav');
  if (!btn) return;
  const old = btn.querySelector('.badge');
  if (old) old.remove();
  const n = Object.keys(progress.wrongBook).length;
  if (n > 0) {
    const b = document.createElement('span');
    b.className = 'badge';
    b.textContent = n > 99 ? '99+' : n;
    btn.appendChild(b);
  }
}

// Time tracking
let sessionStart = Date.now();
let isVisible = !document.hidden;
function flushTime() {
  if (!isVisible) return;
  const now = Date.now();
  const elapsed = Math.floor((now - sessionStart)/1000);
  if (elapsed > 0 && elapsed < 300) { // ignore long idle gaps > 5 min
    addStudyTime(elapsed);
    save();
  }
  sessionStart = now;
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { flushTime(); isVisible = false; }
  else { sessionStart = Date.now(); isVisible = true; }
});
window.addEventListener('beforeunload', flushTime);
setInterval(flushTime, 30000); // flush every 30s

checkInToday();

function speak(text, rate = 0.9) {
  if (!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US';
  u.rate = rate;
  u.pitch = 1;
  speechSynthesis.speak(u);
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove('show'), 1500);
}

let browseFilter = 'all';

document.querySelectorAll('#nav button').forEach(b => {

    document.querySelectorAll('#nav button').forEach(x => x.classList.remove('active'));

}

// ============ WRONG BOOK ============
let wrongPracticeMode = false;
let wrongDeck = [];
let wrongPracticeIdx = 0;
let wrongAnswered = false;

function renderWrong() {
  const words = Object.keys(progress.wrongBook);

  if (wrongPracticeMode) {
    if (wrongDeck.length === 0) {
      wrongPracticeMode = false;
      renderWrong();
      return;
    }
    const w = wrongDeck[wrongPracticeIdx % wrongDeck.length];
    const v = VOCAB_MAP[w];
    const wbEntry = progress.wrongBook[w] || {correctStreak: 0, count: 0};

    panel.innerHTML = `
      <div class="wb-practice-mode">
        <button class="story-back" id="wbExit">◀ Exit Practice</button>
        <div style="color:#888;font-size:13px;margin-bottom:8px;">Question ${wrongPracticeIdx+1} · ${wrongDeck.length} words left</div>
        <div style="font-size:12px;color:#c0392b;margin-bottom:8px;">Wrong ${wbEntry.count} times · Get ${wbEntry.correctStreak||0}/2 correct in a row to graduate</div>
        <div class="spell-meaning">${v.meaning}</div>
        <div class="spell-hint">Hint: ${v.word.length} letters, starts with <b>${v.word[0]}</b></div>
        <input type="text" class="spell-input" id="wbInput" placeholder="Type the word..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
        <div class="spell-feedback" id="wbFeedback"></div>
        <div class="spell-actions">
          <button class="btn-speak" id="wbSpeak" style="background:#28c76f;color:white;">🔊 Listen</button>
          <button id="wbCheck" style="background:#667eea;color:white;">Check</button>
          <button id="wbShow" style="background:#f0f2f5;color:#666;">Show Answer</button>
          <button id="wbNext" style="background:#ff9f43;color:white;">Next ▶</button>
        </div>
      </div>`;

    const input = document.getElementById('wbInput');
    const fb = document.getElementById('wbFeedback');
    setTimeout(() => input.focus(), 50);
    speak(v.word);

    function nextWb() {
      // re-fetch active deck; word may have graduated and been removed
      wrongDeck = Object.keys(progress.wrongBook);
      if (wrongDeck.length === 0) { wrongPracticeMode = false; renderWrong(); return; }
      wrongPracticeIdx = (wrongPracticeIdx + 1) % wrongDeck.length;
      wrongAnswered = false;
      renderWrong();
    }

    function checkWb() {
      if (wrongAnswered) return;
      const ans = input.value.trim().toLowerCase();
      if (!ans) return;
      wrongAnswered = true;
      if (ans === v.word.toLowerCase()) {
        input.classList.add('correct');
        const newStreak = (progress.wrongBook[w]?.correctStreak || 0) + 1;
        if (newStreak >= 2) {
          fb.textContent = `🎓 Two in a row! "${v.word}" graduated!`;
        } else {
          fb.textContent = `🎉 Correct! 1 more in a row to graduate`;
        }
        fb.className = 'spell-feedback correct';
        progress.spellRight++;
        addCorrect();
        recordWrongBookCorrect(w);
        save();
        speak(v.word);
      } else {
        input.classList.add('wrong');
        fb.textContent = `❌ Wrong. Correct answer: ${v.word}`;
        fb.className = 'spell-feedback wrong';
        progress.spellWrong++;
        recordWrong(w);
        save();
      }
    }

    document.getElementById('wbCheck').onclick = checkWb;
    document.getElementById('wbShow').onclick = () => {
      fb.textContent = `Answer: ${v.word}`;
      fb.className = 'spell-feedback wrong';
      input.value = v.word; input.classList.add('wrong');
      wrongAnswered = true;
    };
    document.getElementById('wbSpeak').onclick = () => speak(v.word);
    document.getElementById('wbNext').onclick = nextWb;
    document.getElementById('wbExit').onclick = () => { wrongPracticeMode = false; renderWrong(); };
    input.onkeydown = (e) => {
      if (e.key === 'Enter') { wrongAnswered ? nextWb() : checkWb(); }
    };
    return;
  }

  if (words.length === 0) {
    panel.innerHTML = `
      <div class="wb-empty">
        <div class="big">📕</div>
        <h3 style="color:#444;margin-bottom:8px;">Mistakes book is empty</h3>
        <p>When you answer wrong in Spell or Quiz, words are added here automatically for review.<br>Each word needs <b>2 correct answers in a row</b> to graduate 🎓</p>
      </div>`;
    return;
  }

  // sort by wrong count desc
  const sorted = words.map(w => ({w, ...progress.wrongBook[w]})).sort((a,b)=>b.count-a.count);

  let html = `
    <div class="wb-summary">
      <div class="num">📕 ${words.length} mistake${words.length>1?'s':''}</div>
      <div class="desc">Keep practicing — 2 correct in a row graduates a word. Reviewing mistakes is the most effective way to learn!</div>
      <button class="wb-practice-btn" id="wbStart">🎯 Practice Mistakes (${words.length})</button>
    </div>
    <div class="wb-list">`;

  sorted.forEach(item => {
    const v = VOCAB_MAP[item.w];
    const streak = item.correctStreak || 0;
    html += `
      <div class="wb-item">
        <div class="info">
          <div class="word">${item.w} <span style="font-size:13px;color:#666;font-weight:500;">${v.meaning}</span></div>
          <div class="meta">Wrong ${item.count} time${item.count>1?'s':''} · Last: ${item.lastWrong || 'today'}</div>
        </div>
        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px;">
          <div class="streak">
            <span class="dot ${streak>=1?'on':''}"></span>
            <span class="dot ${streak>=2?'on':''}"></span>
          </div>
          <div class="actions">
            <button style="background:#667eea;color:white;" data-speak="${item.w}">🔊</button>
            <button style="background:#f0f2f5;color:#666;" data-remove="${item.w}">Remove</button>
          </div>
        </div>
      </div>`;
  });
  html += '</div>';
  panel.innerHTML = html;

  document.getElementById('wbStart').onclick = () => {
    wrongDeck = shuffle(Object.keys(progress.wrongBook));
    wrongPracticeIdx = 0;
    wrongAnswered = false;
    wrongPracticeMode = true;
    renderWrong();
  };
  panel.querySelectorAll('[data-speak]').forEach(b => b.onclick = () => speak(b.dataset.speak));
  panel.querySelectorAll('[data-remove]').forEach(b => b.onclick = () => {
    if (confirm(`Remove "${b.dataset.remove}" from the mistakes book?`)) {
      delete progress.wrongBook[b.dataset.remove];
      save(); updateWrongBadge(); renderWrong();
    }
  });
}


// ============ STORY ============
let currentStoryId = null;

function renderStory() {
  if (currentStoryId === null) {
    let html = '<div style="text-align:center;margin-bottom:14px;color:#666;font-size:13px;">📖 Learn vocabulary through Qing Dynasty stories</div>';
    html += '<div class="story-list">';
    STORIES.forEach(s => {
      html += `
        <div class="story-card" data-sid="${s.id}">
          <div class="s-title">${s.icon} ${s.title}</div>
          <div class="s-era">${s.subtitle} · ${s.era}</div>
          <div class="s-intro">${s.intro}</div>
          <span class="s-tag">${s.words.length} words</span>
        </div>`;
    });
    html += '</div>';
    panel.innerHTML = html;
    panel.querySelectorAll('.story-card').forEach(c => {
      c.onclick = () => { currentStoryId = parseInt(c.dataset.sid); renderStory(); };
    });
  } else {
    const s = STORIES.find(x => x.id === currentStoryId);
    const renderPara = (p) => p.replace(/\[(\w+)\]/g, (_, w) => {
      const v = VOCAB_MAP[w];
      if (!v) return w;
      return `<span class="vocab-inline" data-w="${w}">${w}<span class="zh">(${v.meaning})</span></span>`;
    });

    let html = `
      <div class="story-detail">
        <button class="story-back" id="storyBack">◀ Back to Stories</button>
        <h2>${s.icon} ${s.title}</h2>
        <div class="era">${s.subtitle} · ${s.era}</div>
        ${s.paragraphs.map(p => `<p>${renderPara(p)}</p>`).join('')}
        <div class="story-words">
          <div class="title">📝 Words in this story (${s.words.length}) — tap to hear</div>
          <div class="chips">
            ${s.words.map(w => `<span class="chip" data-w="${w}">${w} · ${VOCAB_MAP[w].meaning}</span>`).join('')}
          </div>
        </div>
      </div>`;
    panel.innerHTML = html;

    document.getElementById('storyBack').onclick = () => { currentStoryId = null; renderStory(); };
    panel.querySelectorAll('[data-w]').forEach(el => {
      el.onclick = (e) => {
        const w = el.dataset.w;
        const v = VOCAB_MAP[w];
        speak(w);
        toast(`${w} = ${v.meaning} · ${v.example}`);
      };
    });
  }
}

// ============ BROWSE ============
function renderBrowse() {
  const filtered = browseFilter === 'all' ? VOCAB : VOCAB.filter(v => v.cat === browseFilter);
  let html = '<div class="cats">';
  html += `<button class="${browseFilter==='all'?'active':''}" data-cat="all">All (${VOCAB.length})</button>`;
  CATS.forEach(c => {
    const n = VOCAB.filter(v => v.cat === c).length;
    html += `<button class="${browseFilter===c?'active':''}" data-cat="${c}">${c} (${n})</button>`;
  });
  html += '</div><div class="word-list">';
  filtered.forEach(v => {
    const mastered = isMastered(v.word);
    html += `
    <div class="word-card ${mastered?'mastered':''}">
      <div class="row1">
        <div class="word">${v.word}${mastered?' ✅':''}</div>
        <div class="meaning">${v.meaning}</div>
      </div>
      <div class="example">"${v.example}"</div>
      <div class="syn-ant">
        <span>Synonym: <b>${v.syn}</b></span>
        <span>Antonym: <b>${v.ant}</b></span>
      </div>
      <div class="actions">
        <button class="btn-play" data-speak="${v.word}">🔊 Word</button>
        <button class="btn-play" data-speak-ex="${encodeURIComponent(v.example)}">🔊 Sentence</button>
        <button class="${mastered?'btn-unmaster':'btn-master'}" data-toggle="${v.word}">${mastered?'Re-learn':'Mastered'}</button>
      </div>
    </div>`;
  });
  html += '</div>';
  panel.innerHTML = html;

  panel.querySelectorAll('.cats button').forEach(b => {
    b.onclick = () => { browseFilter = b.dataset.cat; renderBrowse(); };
  });
  panel.querySelectorAll('[data-speak]').forEach(b => {
    b.onclick = () => speak(b.dataset.speak);
  });
  panel.querySelectorAll('[data-speak-ex]').forEach(b => {
    b.onclick = () => speak(decodeURIComponent(b.dataset.speakEx));
  });
  panel.querySelectorAll('[data-toggle]').forEach(b => {
    b.onclick = () => { toggleMaster(b.dataset.toggle); renderBrowse(); };
  });
}

// ============ FLASHCARD ============
let flashIdx = 0;
let flashFlipped = false;
let flashDir = 'en2zh'; // en2zh or zh2en
let flashDeck = null;

function renderFlash() {
  if (!flashDeck) flashDeck = shuffle([...VOCAB]);
  const v = flashDeck[flashIdx];
  const front = flashDir === 'en2zh' ? v.word : v.meaning;
  const back = flashDir === 'en2zh'
    ? `<div class="big">${v.meaning}</div><div class="small">"${v.example}"</div>`
    : `<div class="big">${v.word}</div><div class="small">"${v.example}"</div>`;

  panel.innerHTML = `
    <div class="flash-wrap">
      <div class="flash-mode-toggle">
        <button class="${flashDir==='en2zh'?'active':''}" data-dir="en2zh">Word → Meaning</button>
        <button class="${flashDir==='zh2en'?'active':''}" data-dir="zh2en">Meaning → Word</button>
      </div>
      <div class="flash-progress">${flashIdx+1} / ${flashDeck.length} · ${v.cat}</div>
      <div class="flash-card ${flashFlipped?'flipped':''}" id="flashCard">
        ${flashFlipped ? back : `<div class="big">${front}</div>`}
        <div class="hint">${flashFlipped?'Tap again to flip back':'Tap the card to see the answer'}</div>
      </div>
      <div class="flash-controls">
        <button class="btn-prev" id="fPrev">◀ Previous</button>
        <button class="btn-speak" id="fSpeak">🔊 Speak</button>
        <button class="btn-next" id="fNext">Next ▶</button>
      </div>
    </div>`;

  panel.querySelectorAll('[data-dir]').forEach(b => {
    b.onclick = () => { flashDir = b.dataset.dir; flashFlipped = false; renderFlash(); };
  });
  document.getElementById('flashCard').onclick = () => {
    flashFlipped = !flashFlipped;
    if (flashFlipped) speak(v.word);
    renderFlash();
  };
  document.getElementById('fPrev').onclick = () => {
    flashIdx = (flashIdx - 1 + flashDeck.length) % flashDeck.length;
    flashFlipped = false; renderFlash();
  };
  document.getElementById('fNext').onclick = () => {
    flashIdx = (flashIdx + 1) % flashDeck.length;
    flashFlipped = false; renderFlash();
  };
  document.getElementById('fSpeak').onclick = () => speak(v.word);
}

// ============ SPELL ============
let spellIdx = 0;
let spellDeck = null;
let spellAnswered = false;

function renderSpell() {
  if (!spellDeck) spellDeck = shuffle([...VOCAB]);
  const v = spellDeck[spellIdx];

  panel.innerHTML = `
    <div class="spell-wrap">
      <div style="color:#888;font-size:13px;">${spellIdx+1} / ${spellDeck.length} · ${v.cat}</div>
      <div class="spell-meaning">${v.meaning}</div>
      <div class="spell-hint">Hint: ${v.word.length} letters, starts with <b>${v.word[0]}</b></div>
      <input type="text" class="spell-input" id="spellInput" placeholder="Type the word..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
      <div class="spell-feedback" id="spellFeedback"></div>
      <div class="spell-actions">
        <button class="btn-speak" id="sSpeak" style="background:#28c76f;color:white;">🔊 Listen</button>
        <button id="sCheck" style="background:#667eea;color:white;">Check</button>
        <button id="sShow" style="background:#f0f2f5;color:#666;">Show Answer</button>
        <button id="sNext" style="background:#ff9f43;color:white;">Next ▶</button>
      </div>
      <div class="spell-stats">✅ Correct ${progress.spellRight} · ❌ Wrong ${progress.spellWrong}</div>
    </div>`;

  const input = document.getElementById('spellInput');
  const fb = document.getElementById('spellFeedback');
  setTimeout(() => input.focus(), 50);

  function check() {
    if (spellAnswered) return;
    const ans = input.value.trim().toLowerCase();
    if (!ans) return;
    if (ans === v.word.toLowerCase()) {
      input.classList.add('correct');
      fb.textContent = '🎉 Correct!';
      fb.className = 'spell-feedback correct';
      progress.spellRight++;
      addCorrect();
      save();
      spellAnswered = true;
      speak(v.word);
    } else {
      input.classList.add('wrong');
      fb.textContent = `❌ Wrong. Correct answer: ${v.word}`;
      fb.className = 'spell-feedback wrong';
      progress.spellWrong++;
      recordWrong(v.word);
      save();
      spellAnswered = true;
    }
  }

  document.getElementById('sCheck').onclick = check;
  input.onkeydown = (e) => {
    if (e.key === 'Enter') {
      if (spellAnswered) nextSpell();
      else check();
    }
  };
  document.getElementById('sSpeak').onclick = () => speak(v.word);
  document.getElementById('sShow').onclick = () => {
    fb.textContent = `Answer: ${v.word}`;
    fb.className = 'spell-feedback wrong';
    input.value = v.word;
    input.classList.add('wrong');
    spellAnswered = true;
  };
  document.getElementById('sNext').onclick = nextSpell;

  function nextSpell() {
    spellIdx = (spellIdx + 1) % spellDeck.length;
    spellAnswered = false;
    renderSpell();
  }

  // auto play
  speak(v.word);
}

// ============ QUIZ ============
let quizIdx = 0;
let quizDeck = null;
let quizAnswered = false;
let quizSessionRight = 0;
let quizSessionTotal = 0;

function renderQuiz() {
  if (!quizDeck) quizDeck = shuffle([...VOCAB]);
  const v = quizDeck[quizIdx];
  const wrongs = shuffle(VOCAB.filter(x => x.word !== v.word)).slice(0, 3);
  const options = shuffle([v, ...wrongs]);

  panel.innerHTML = `
    <div class="quiz-wrap">
      <div class="quiz-progress">Question ${quizIdx+1} / ${quizDeck.length} · ${v.cat}</div>
      <div class="quiz-q">
        <div class="label">What does this word mean?</div>
        <div class="word">${v.word} <button id="qSpeak" style="background:none;border:none;font-size:24px;cursor:pointer;">🔊</button></div>
      </div>
      <div class="quiz-options" id="quizOpts">
        ${options.map((o,i) => `<button data-i="${i}" data-correct="${o.word===v.word}">${String.fromCharCode(65+i)}. ${o.meaning}</button>`).join('')}
      </div>
      <div class="quiz-score">This round: ✅ ${quizSessionRight} / ${quizSessionTotal}　Total: ✅ ${progress.quizRight} · ❌ ${progress.quizWrong}</div>
    </div>`;

  document.getElementById('qSpeak').onclick = () => speak(v.word);
  speak(v.word);

  panel.querySelectorAll('#quizOpts button').forEach(btn => {
    btn.onclick = () => {
      if (quizAnswered) return;
      quizAnswered = true;
      const correct = btn.dataset.correct === 'true';
      panel.querySelectorAll('#quizOpts button').forEach(b => {
        b.disabled = true;
        if (b.dataset.correct === 'true') b.classList.add('correct');
        else if (b === btn) b.classList.add('wrong');
      });
      quizSessionTotal++;
      if (correct) {
        progress.quizRight++; quizSessionRight++;
        addCorrect();
        toast('🎉 Correct!');
      } else {
        progress.quizWrong++;
        recordWrong(v.word);
        toast(`❌ Wrong. Answer: ${v.meaning}`);
      }
      save();
      setTimeout(() => {
        quizIdx = (quizIdx + 1) % quizDeck.length;
        if (quizIdx === 0) { quizDeck = shuffle([...VOCAB]); }
        quizAnswered = false;
        renderQuiz();
      }, 1400);
    };
  });
}

// ============ PROGRESS / DATA ============
let calMonth = null; // {y, m} for navigation; null = current

function renderProgress() {
  flushTime();
  const total = VOCAB.length;
  const done = progress.mastered.length;
  const pct = Math.round(done / total * 100);
  const t = todayStr();
  const todayTime = progress.dailyTime[t] || 0;
  const todayCorrect = progress.dailyCorrect[t] || 0;
  const streak = getStreak();
  const checkedToday = progress.studyDays.includes(t);

  // 7-day chart
  const last7 = [];
  for (let i = 6; i >= 0; i--) {
    const d = new Date();
    d.setDate(d.getDate() - i);
    const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    last7.push({ date: key, day: ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d.getDay()], time: progress.dailyTime[key]||0, isToday: i===0 });
  }
  const maxTime = Math.max(...last7.map(d=>d.time), 60);
  const weekTotal = last7.reduce((s,d)=>s+d.time, 0);
  const studiedDaysWeek = last7.filter(d=>d.time>0).length;
  const avgPerStudyDay = studiedDaysWeek ? Math.round(weekTotal / studiedDaysWeek) : 0;

  // Calendar
  const now = new Date();
  const cy = calMonth?.y ?? now.getFullYear();
  const cm = calMonth?.m ?? now.getMonth();
  const firstDay = new Date(cy, cm, 1).getDay();
  const daysInMonth = new Date(cy, cm+1, 0).getDate();
  const checkedSet = new Set(progress.studyDays);
  let calCells = '';
  ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].forEach(d => calCells += `<div class="dh">${d}</div>`);
  for (let i = 0; i < firstDay; i++) calCells += `<div class="day empty"></div>`;
  for (let d = 1; d <= daysInMonth; d++) {
    const key = `${cy}-${String(cm+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isToday = (cy === now.getFullYear() && cm === now.getMonth() && d === now.getDate());
    const checked = checkedSet.has(key);
    const cls = ['day'];
    if (isToday) cls.push('today');
    if (checked) cls.push('checked');
    const tooltip = checked && progress.dailyTime[key] ? ` title="Studied ${fmtTime(progress.dailyTime[key])}"` : '';
    calCells += `<div class="${cls.join(' ')}"${tooltip}>${d}</div>`;
  }

  let catHtml = '';
  CATS.forEach(c => {
    const all = VOCAB.filter(v => v.cat === c);
    const m = all.filter(v => isMastered(v.word)).length;
    catHtml += `
      <div class="prog-cat">
        <span class="name">${c}</span>
        <span class="count">${m} / ${all.length}</span>
      </div>`;
  });

  // Parent stats
  const totalDays = progress.studyDays.length;
  const totalSec = Object.values(progress.dailyTime).reduce((a,b)=>a+b, 0);
  const wrongCount = Object.keys(progress.wrongBook).length;

  panel.innerHTML = `
    <div class="prog-wrap">
      <!-- Today + Streak -->
      <div class="today-card">
        <div class="checkin-row">
          <div class="title">${checkedToday?'✅ Checked in today':'⏰ Not studied yet today'}</div>
          <div class="streak">🔥 ${streak}-day streak</div>
        </div>
        <div style="font-size:13px;opacity:0.9;">${new Date().toLocaleDateString('en-US', {year:'numeric',month:'long',day:'numeric',weekday:'long'})}</div>
        <div class="row">
          <div class="stat"><div class="n">${fmtTime(todayTime)}</div><div class="l">Time today</div></div>
          <div class="stat"><div class="n">${todayCorrect}</div><div class="l">Correct today</div></div>
          <div class="stat"><div class="n">${done}/${total}</div><div class="l">Words mastered</div></div>
        </div>
      </div>

      <!-- 7-day chart -->
      <div class="chart">
        <div class="title">📈 Last 7 Days Study Time</div>
        <div class="chart-bars">
          ${last7.map(d => {
            const h = Math.max(2, Math.round(d.time/maxTime*100));
            const minStr = d.time >= 60 ? `${Math.round(d.time/60)}m` : (d.time>0?`${d.time}s`:'');
            return `<div class="chart-bar ${d.isToday?'today':''}">
              <div class="bar ${d.time===0?'zero':''}" style="height:${h}%">${minStr?`<div class="v">${minStr}</div>`:''}</div>
              <div class="label">${d.day}</div>
            </div>`;
          }).join('')}
        </div>
        <div style="text-align:center;margin-top:10px;font-size:12px;color:#888;">
          Week total: <b style="color:#667eea;">${fmtTime(weekTotal)}</b> · Studied ${studiedDaysWeek} day${studiedDaysWeek===1?'':'s'}
        </div>
      </div>

      <!-- Calendar -->
      <div class="calendar">
        <div class="ch-title">
          <button class="nav-btn" id="calPrev">◀</button>
          <div class="month">📅 ${['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][cm]} ${cy} Check-in Calendar</div>
          <button class="nav-btn" id="calNext">▶</button>
        </div>
        <div class="cal-grid">${calCells}</div>
        <div style="text-align:center;margin-top:8px;font-size:12px;color:#888;">
          Green = studied that day
        </div>
      </div>

      <!-- Master progress -->
      <div class="prog-summary">
        <div class="prog-num">${done} / ${total}</div>
        <div style="color:#666;font-size:14px;">Words Mastered</div>
        <div class="prog-bar"><div class="prog-bar-fill" style="width:${pct}%"></div></div>
        <div style="color:#888;font-size:13px;">${pct}% complete</div>
      </div>

      <div style="margin-bottom:10px;font-weight:600;color:#444;">📂 Progress by Category</div>
      <div class="prog-cats">${catHtml}</div>

      <div style="margin-top:18px;padding:14px;background:#f8f9ff;border-radius:10px;text-align:center;font-size:14px;color:#555;">
        🎯 Spell: ✅ ${progress.spellRight} correct · ❌ ${progress.spellWrong} wrong<br>
        🏆 Quiz: ✅ ${progress.quizRight} correct · ❌ ${progress.quizWrong} wrong
      </div>

      <!-- Parent section -->
      <div class="parent-section" style="margin-top:18px;">
        <div class="ph">👨‍👩‍👧 Parent View</div>
        <div class="parent-stats">
          <div class="ps"><div class="n">${totalDays}</div><div class="l">Total study days</div></div>
          <div class="ps"><div class="n">${fmtTime(totalSec)}</div><div class="l">Total study time</div></div>
          <div class="ps"><div class="n">${avgPerStudyDay?fmtTime(avgPerStudyDay):'—'}</div><div class="l">Avg / day this week</div></div>
          <div class="ps"><div class="n">${streak} day${streak===1?'':'s'}</div><div class="l">Current streak</div></div>
          <div class="ps"><div class="n">${progress.spellRight + progress.quizRight}</div><div class="l">Total correct</div></div>
          <div class="ps"><div class="n">${progress.spellWrong + progress.quizWrong}</div><div class="l">Total wrong</div></div>
          <div class="ps"><div class="n">${pct}%</div><div class="l">Mastery rate</div></div>
          <div class="ps"><div class="n" style="color:${wrongCount>0?'#c0392b':'#28c76f'};">${wrongCount}</div><div class="l">Mistakes pending</div></div>
        </div>
        <div style="margin-top:10px;text-align:center;">
          <button id="exportBtn" style="background:#8b4513;color:white;border:none;padding:8px 16px;border-radius:8px;font-size:12px;cursor:pointer;">📋 Copy Study Report</button>
        </div>
      </div>

      <button class="reset-btn" id="resetBtn">🗑 Clear All Progress (use with care)</button>
    </div>`;

  document.getElementById('calPrev').onclick = () => {
    const m = cm - 1; const y = m < 0 ? cy - 1 : cy;
    calMonth = { y, m: (m+12)%12 }; renderProgress();
  };
  document.getElementById('calNext').onclick = () => {
    const m = cm + 1; const y = m > 11 ? cy + 1 : cy;
    calMonth = { y, m: m%12 }; renderProgress();
  };
  document.getElementById('exportBtn').onclick = () => {
    const lines = [
      `📖 Study Report · ${new Date().toLocaleDateString('en-US')}`,
      `--------------------------`,
      `Today: ${fmtTime(todayTime)} · ${todayCorrect} correct`,
      `Streak: ${streak} day${streak===1?'':'s'} · Total study days: ${totalDays}`,
      `This week: ${fmtTime(weekTotal)}`,
      `Words mastered: ${done}/${total} (${pct}%)`,
      `Total correct/wrong: ${progress.spellRight + progress.quizRight} / ${progress.spellWrong + progress.quizWrong}`,
      `Mistakes pending: ${wrongCount}`
    ].join('\n');
    if (navigator.clipboard) {
      navigator.clipboard.writeText(lines).then(()=>toast('📋 Report copied to clipboard'));
    } else {
      alert(lines);
    }
  };
  document.getElementById('resetBtn').onclick = () => {
    if (confirm('Clear all progress?\n(Mistakes book, check-in records, and study time will all be erased.)')) {
      progress = JSON.parse(JSON.stringify(DEFAULT_PROGRESS));
      save(); updateWrongBadge(); renderProgress();
      toast('Cleared');
    }
  };
}

function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// preload voices on iOS/Safari
if ('speechSynthesis' in window) speechSynthesis.getVoices();

render();
updateWrongBadge();
</script>
